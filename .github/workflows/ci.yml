name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install (bun.lock, frozen)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint changed files
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The repository has known lint debt, so only .ts/.tsx files changed here are linted.
          list_changed() {
            if [ "$EVENT" = "pull_request" ]; then
              git diff --name-only -z --diff-filter=ACMR "$PR_BASE...$PR_HEAD"
            elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] \
                || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              git diff-tree --no-commit-id --name-only -r -z --root --diff-filter=ACMR "$PUSH_AFTER"
            else
              git diff --name-only -z --diff-filter=ACMR "$PUSH_BEFORE" "$PUSH_AFTER"
            fi
          }
          files=()
          while IFS= read -r -d '' f; do
            case "$f" in *.ts|*.tsx) files+=("$f") ;; esac
          done < <(list_changed)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed .ts/.tsx files."
            exit 0
          fi
          printf 'Linting %s\n' "${files[@]}"
          bunx eslint --no-warn-ignored -- "${files[@]}"
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Build leaves the tree clean
        run: |
          # The build regenerates supabase/functions/mcp/index.ts; it must match the committed file.
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff --stat
            exit 1
          fi

  edge:
    name: edge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - name: deno check
        run: |
          deno check \
            supabase/functions/analyze-movement/index.ts \
            supabase/functions/create-student/index.ts \
            supabase/functions/generate-protocol/index.ts \
            supabase/functions/get-signed-url/index.ts
